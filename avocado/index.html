<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avocado</title>
<style>
:root{--bg:#f3f1ea;--ink:#1c1b17;--muted:#6a675c;--accent:#2c6a46;--on:#fff;--stage:#e4e1d3;color-scheme:light}@media (prefers-color-scheme:dark){:root{--bg:#14130f;--ink:#f3f1ea;--muted:#aaa795;--accent:#7fd0a0;--on:#10150f;--stage:#201f19;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#mobile{min-height:100%;display:grid;place-content:center;gap:16px;text-align:center;padding:24px}#mobile p{margin:0;color:var(--muted)}h1{margin:0;font-size:24px;line-height:1.2}
.btn{display:inline-block;background:var(--accent);color:var(--on);font:700 18px system-ui,sans-serif;padding:16px 28px;border-radius:999px;text-decoration:none}
#desk{min-height:100%;display:flex;flex-direction:column}header{padding:18px 18px 4px}header p{margin:4px 0 0;color:var(--muted)}
model-viewer{flex:1;min-height:60vh;width:100%;background:radial-gradient(ellipse at 50% 65%,var(--stage),transparent 75%);--poster-color:transparent;--progress-bar-color:var(--accent)}.note{padding:10px 18px 22px;font-size:14px;color:var(--muted)}
</style></head>
<body>
<div id="mobile" hidden><h1>Avocado</h1><p id="msg">Opening in AR...</p><a id="go" class="btn" href="#" hidden>Tap to view in AR</a></div>
<div id="desk" hidden><header><h1>Avocado</h1></header>
<model-viewer src="model.glb" alt="Avocado" camera-controls auto-rotate camera-orbit="30deg 65deg auto" shadow-intensity="1.1" exposure="1.05" interaction-prompt="none"></model-viewer>
<div class="note">Drag to turn it. Scan the QR code with a phone to see it in AR.</div></div>
<script>
(function(){
  var dir = location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/, ""), glb = dir + "model.glb", usdz = dir + "model.usdz", title = "Avocado";
  var ua = navigator.userAgent, ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1), android = /Android/i.test(ua);
  var q = "file=" + encodeURIComponent(glb) + "&mode=ar_only&title=" + encodeURIComponent(title);
  var intent = "intent://arvr.google.com/scene-viewer/1.0?" + q + "#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=" + encodeURIComponent("https://arvr.google.com/scene-viewer/1.0?" + q) + ";end;";
  function showBtn(href){ var g = document.getElementById("go"); g.href = href; g.hidden = false; document.getElementById("msg").textContent = "If AR did not open on its own, tap the button."; }
  if (ios) { document.getElementById("mobile").hidden = false; setTimeout(function(){ showBtn(usdz); }, 1500); location.replace(usdz); }
  else if (android) { document.getElementById("mobile").hidden = false; setTimeout(function(){ showBtn(intent); }, 1200); location.href = intent; }
  else { document.getElementById("desk").hidden = false; }
})();
</script>
<script type="module" src="model-viewer.min.js"></script>
</body></html>
