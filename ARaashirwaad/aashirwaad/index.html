<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aashirwaad menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;700&family=Noto+Sans+Kannada:wght@500;700&display=swap">
<style>
:root{--bg:#edf1e4;--card:#fbfcf7;--ink:#14231b;--muted:#566657;--line:#cfd8c3;--leaf:#2c6a46;--turmeric:#a96300;--stage:#e3ead6;--display:"Baloo Tamma 2","Noto Sans Kannada",system-ui,sans-serif;--body:"Hanken Grotesk","Noto Sans Kannada",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#101c16;--card:#18281f;--ink:#f1ead6;--muted:#a9b9a6;--line:#2c4034;--leaf:#7fd0a0;--turmeric:#f2b84b;--stage:#21352a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:20px 16px 48px}.wrap{max-width:520px;margin:0 auto;display:grid;gap:22px}h1,h3{font-family:var(--display);margin:0;line-height:1.1}h1{font-size:34px;font-weight:800}.sub{color:var(--muted);margin:6px 0 0}
.dish{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}model-viewer{width:100%;height:300px;background:radial-gradient(ellipse at 50% 70%,var(--stage),transparent 75%);--poster-color:transparent;--progress-bar-color:var(--leaf)}
.ar-btn{position:absolute;right:10px;bottom:10px;border:0;background:var(--leaf);color:var(--card);font:700 14px var(--body);padding:9px 14px;border-radius:999px}.info{padding:14px 16px 16px;display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.name{font-size:22px;font-weight:700}.kn{color:var(--muted);font-size:15px;margin:0}
.price{font-family:var(--display);font-size:24px;font-weight:800;color:var(--turmeric);white-space:nowrap}.order{display:flex;justify-content:center;align-items:center;min-height:44px;border-radius:12px;background:var(--leaf);color:var(--card);font-weight:700;text-decoration:none}.stage{position:relative}
</style></head>
<body><div class="wrap">
  <header><h1>aashirwaad</h1><p class="sub">Scan the table QR, spin any dish, see it before you order.</p></header>
  <article class="dish">
    <div class="stage">
      <model-viewer src="3dmodel.glb" alt="3DModel" camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="18deg" camera-orbit="30deg 65deg auto" shadow-intensity="1.1" shadow-softness="0.9" exposure="1.05" ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" interaction-prompt="none">
        <button slot="ar-button" class="ar-btn">View on your table</button>
      </model-viewer>
    </div>
    <div class="info">
      <div class="row"><div><h3 class="name">3DModel</h3><p class="kn">sharath</p></div><span class="price">₹130</span></div>
      <a class="order" href="https://wa.me/9892359098?text=Hi%2C%20I%20would%20like%20to%20order%3A%201%203DModel%20(%E2%82%B9130)" target="_blank" rel="noopener">Order on WhatsApp</a>
    </div>
  </article>
</div>
<script type="module" src="model-viewer.min.js"></script>
</body></html>
