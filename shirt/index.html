<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shirt</title>
<style>
:root{--bg:#f3f1ea;--ink:#1c1b17;--muted:#6a675c;--accent:#2c6a46;--on:#fff;--stage:#e4e1d3;color-scheme:light}@media (prefers-color-scheme:dark){:root{--bg:#14130f;--ink:#f3f1ea;--muted:#aaa795;--accent:#7fd0a0;--on:#10150f;--stage:#201f19;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column}header{padding:18px 18px 4px}h1{margin:0;font-size:24px;line-height:1.2}header p{margin:4px 0 0;color:var(--muted)}
model-viewer{flex:1;min-height:62vh;width:100%;background:radial-gradient(ellipse at 50% 65%,var(--stage),transparent 75%);--poster-color:transparent;--progress-bar-color:var(--accent)}
#arbtn{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--accent);color:var(--on);font:700 18px system-ui,sans-serif;padding:16px 30px;border:0;border-radius:999px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip{margin:0;padding:10px 18px 4px;font-size:14px;color:var(--muted)}
#row{padding:8px 18px 22px}#cambtn{background:transparent;color:var(--accent);font:700 16px system-ui,sans-serif;padding:12px 20px;border:2px solid var(--accent);border-radius:999px}
#cam{position:fixed;inset:0;z-index:5;background:#000;display:none}#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#cam model-viewer{position:absolute;inset:0;width:100%;height:100%;min-height:0;background:transparent}
#camx{position:absolute;top:14px;right:14px;z-index:6;background:rgba(0,0,0,.6);color:#fff;font:700 16px system-ui,sans-serif;padding:10px 16px;border:0;border-radius:999px}#camhint{position:absolute;left:0;right:0;bottom:18px;z-index:6;text-align:center;color:#fff;font:14px system-ui,sans-serif;text-shadow:0 1px 4px #000;padding:0 16px}
</style></head>
<body>
<main>
<header><h1>Shirt</h1></header>
<model-viewer id="mv" src="model.glb" ios-src="model.usdz" alt="Shirt" ar ar-modes="scene-viewer quick-look webxr" ar-scale="fixed" camera-controls auto-rotate camera-orbit="30deg 65deg auto" shadow-intensity="1.1" exposure="1.05" interaction-prompt="none">
  <button slot="ar-button" id="arbtn">View in AR</button>
</model-viewer>
<p id="tip">Drag to turn it. Tap <b>View in AR</b> to place it in your room.</p>
<div id="row"><button id="cambtn" type="button">Camera view (works on any phone)</button></div>
</main>
<div id="cam"><video id="camv" playsinline muted autoplay></video><model-viewer id="mv2" src="model.glb" alt="Shirt" camera-controls disable-pan camera-orbit="30deg 70deg auto" shadow-intensity="0" exposure="1.1" interaction-prompt="none"></model-viewer><button id="camx" type="button">Close</button><div id="camhint">Drag to turn it, pinch to resize. Move the phone to place it.</div></div>
<script>
(function(){
  var mv = document.getElementById("mv"), tip = document.getElementById("tip"), ua = navigator.userAgent;
  var inApp = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|Snapchat|Twitter|; wv\)|GSA\//i.test(ua);
  var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var browser = ios ? "Safari" : "Chrome";
  mv.addEventListener("load", function(){
    if (!mv.canActivateAR) tip.textContent = "AR is not available in this browser. " + (inApp ? "Open this page in " + browser + " (menu, then Open in browser)." : "Try " + browser + " on a phone that supports AR.");
    else if (inApp) tip.textContent = "If AR does not start, open this page in " + browser + " (menu, then Open in browser).";
  });
  var cam = document.getElementById("cam"), camv = document.getElementById("camv"), stream = null;
  function closeCam(){ cam.style.display = "none"; if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; } camv.srcObject = null; }
  document.getElementById("cambtn").addEventListener("click", function(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { tip.textContent = "Camera view needs a browser that allows the camera. Open this page in Chrome or Safari."; return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false }).then(function(s){
      stream = s; camv.srcObject = s; cam.style.display = "block"; camv.play && camv.play().catch(function(){});
    }).catch(function(){ tip.textContent = "Camera permission was blocked. Allow the camera for this page and try again."; });
  });
  document.getElementById("camx").addEventListener("click", closeCam);
  mv.addEventListener("error", function(){ tip.textContent = "The 3D model could not load. Check your internet connection and reload the page."; });
})();
</script>
<script type="module" src="model-viewer.min.js"></script>
</body></html>
